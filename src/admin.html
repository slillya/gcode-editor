<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>FeedFix Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Saira+Condensed:wght@600;700&amp;display=swap">
<style>
:root {
  --bg: #e8ecef; --surface: #f7f9fa; --surface-2: #ffffff; --ink: #13181c; --ink-2: #46525b; --ink-3: #6c7984;
  --rule: #cdd5db; --rule-2: #e0e5e9; --accent: #d9480f; --accent-ink: #ffffff; --accent-soft: #fbe6da;
  --bug: #b3261e; --bug-soft: #f8dfdc; --feat: #1c62c8; --feat-soft: #dde9fb; --ok: #1b7648; --ok-soft: #ddf1e5;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1013; --surface: #15191c; --surface-2: #1c2125; --ink: #e2e7ea; --ink-2: #a3aeb6; --ink-3: #75828b;
    --rule: #2a3238; --rule-2: #20272c; --accent: #ff7a33; --accent-ink: #1a0b03; --accent-soft: #3a1f12;
    --bug: #ff7369; --bug-soft: #3a1714; --feat: #6aa4ff; --feat-soft: #152640; --ok: #52c98f; --ok-soft: #13291e;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1013; --surface: #15191c; --surface-2: #1c2125; --ink: #e2e7ea; --ink-2: #a3aeb6; --ink-3: #75828b;
  --rule: #2a3238; --rule-2: #20272c; --accent: #ff7a33; --accent-ink: #1a0b03; --accent-soft: #3a1f12;
  --bug: #ff7369; --bug-soft: #3a1714; --feat: #6aa4ff; --feat-soft: #152640; --ok: #52c98f; --ok-soft: #13291e;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font: 700 26px/1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
h1 span { color: var(--ink-3); font-weight: 600; }
.spacer { flex: 1; }
.btn { min-height: 34px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface-2); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--ink-3); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; }
.login { display: flex; flex-direction: column; gap: 10px; max-width: 460px; }
.login label { color: var(--ink-2); font-size: 13px; }
.login .row { display: flex; gap: 8px; flex-wrap: wrap; }
.login input { flex: 1 1 220px; min-height: 36px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface-2); padding: 6px 10px; font-family: var(--font-mono); }
.fine { color: var(--ink-3); font-size: 12.5px; margin: 0; }
.msg { margin: 0; padding: 9px 12px; border-radius: 6px; background: var(--bug-soft); color: var(--bug); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--rule); background: var(--surface-2); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.count { font-family: var(--font-mono); color: var(--ink-3); font-size: 12.5px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.rep { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.rep.st-done { opacity: 0.62; }
.rep-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kind { font: 600 11.5px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 7px 3px; border-radius: 3px; }
.kind-bug { background: var(--bug-soft); color: var(--bug); }
.kind-feature { background: var(--feat-soft); color: var(--feat); }
.rep h2 { margin: 0; font-size: 16px; font-weight: 600; flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.new-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.details { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.rep-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.rep-foot select { min-height: 32px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface-2); padding: 0 6px; }
details.ctx summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
details.ctx pre { margin: 6px 0 0; padding: 10px; background: var(--surface-2); border: 1px solid var(--rule-2); border-radius: 6px; font: 12px/1.45 var(--font-mono); overflow-x: auto; }
.empty { text-align: center; color: var(--ink-3); padding: 28px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FeedFix <span>Inbox</span></h1>
    <span class="spacer"></span>
    <button class="btn" id="refresh" type="button" hidden>Refresh</button>
    <button class="btn" id="signOut" type="button" hidden>Forget token</button>
  </header>

  <section class="panel login" id="login" aria-labelledby="loginH">
    <h2 id="loginH" style="margin:0;font:600 13px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)">Open the inbox</h2>
    <label for="token">Inbox token (the ADMIN_TOKEN secret you set on the Worker)</label>
    <form class="row" id="loginForm">
      <input id="token" type="password" autocomplete="current-password" required>
      <button class="btn btn-accent" type="submit">Open</button>
    </form>
    <p class="fine">The token is remembered on this device only.</p>
  </section>

  <p class="msg" id="error" hidden></p>

  <section id="inbox" hidden aria-label="Reports">
    <div class="filters" role="group" aria-label="Filter reports">
      <button class="chip" type="button" data-f="open" aria-pressed="true">Open</button>
      <button class="chip" type="button" data-f="all" aria-pressed="false">All</button>
      <button class="chip" type="button" data-f="bug" aria-pressed="false">Bugs</button>
      <button class="chip" type="button" data-f="feature" aria-pressed="false">Feature requests</button>
      <button class="chip" type="button" data-f="done" aria-pressed="false">Done</button>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list" style="margin-top:12px"></div>
  </section>
</div>
<script>
(function () {
  'use strict';
  var API = new URL('api/reports', location.href).toString();
  var token = '';
  var reports = [];
  var filter = 'open';
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  try { token = localStorage.getItem('feedfix.inbox') || ''; } catch (e) { token = ''; }

  function showError(msg) { $('error').textContent = msg; $('error').hidden = !msg; }

  function call(path, init) {
    init = init || {};
    init.headers = Object.assign({ authorization: 'Bearer ' + token }, init.headers || {});
    return fetch(path, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ('The server answered ' + r.status + '.'));
        return j;
      });
    });
  }

  function load() {
    showError('');
    call(API).then(function (j) {
      reports = j.reports || [];
      $('login').hidden = true;
      $('inbox').hidden = false;
      $('refresh').hidden = false;
      $('signOut').hidden = false;
      render();
    }, function (err) {
      showError(err.message === 'Failed to fetch' ? 'Could not reach the inbox. Check the connection and that the Worker is deployed.' : err.message);
      $('login').hidden = false;
      $('inbox').hidden = true;
    });
  }

  function visible(r) {
    if (filter === 'open') return r.status !== 'done';
    if (filter === 'done') return r.status === 'done';
    if (filter === 'bug' || filter === 'feature') return r.kind === filter;
    return true;
  }

  function when(iso) {
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function render() {
    var list = $('list'), shown = reports.filter(visible);
    var open = reports.filter(function (r) { return r.status !== 'done'; }).length;
    $('count').textContent = open + ' open · ' + reports.length + ' total';
    list.textContent = '';
    if (!shown.length) { list.appendChild(el('p', 'empty', reports.length ? 'Nothing here with this filter.' : 'No reports yet.')); return; }
    shown.forEach(function (r) {
      var card = el('article', 'rep st-' + r.status);
      var head = el('div', 'rep-head');
      if (r.status === 'new') { var dot = el('span', 'new-dot'); dot.title = 'New'; head.appendChild(dot); }
      head.appendChild(el('span', 'kind kind-' + r.kind, r.kind === 'bug' ? 'Bug' : 'Feature'));
      head.appendChild(el('h2', null, r.title));
      head.appendChild(el('span', 'meta', '#' + r.id + ' · ' + when(r.created_at)));
      card.appendChild(head);
      card.appendChild(el('p', 'details', r.details));
      if (r.context) {
        var ctx = el('details', 'ctx');
        ctx.appendChild(el('summary', null, 'App, browser and settings'));
        var pretty = r.context;
        try { pretty = JSON.stringify(JSON.parse(r.context), null, 2); } catch (e) { /* keep raw */ }
        ctx.appendChild(el('pre', null, pretty));
        card.appendChild(ctx);
      }
      var foot = el('div', 'rep-foot');
      foot.appendChild(el('span', 'meta', r.contact ? 'From: ' + r.contact : 'No contact given'));
      if (r.attachment_name) {
        var dl = el('button', 'btn', 'Download ' + r.attachment_name + ' (' + Math.ceil((r.attachment_size || 0) / 1024) + ' KB)');
        dl.type = 'button';
        dl.addEventListener('click', function () { download(r.id); });
        foot.appendChild(dl);
      }
      foot.appendChild(el('span', 'spacer'));
      var lab = el('label', 'meta', 'Status ');
      var sel = el('select');
      ['new', 'seen', 'done'].forEach(function (s) {
        var o = el('option', null, s.charAt(0).toUpperCase() + s.slice(1));
        o.value = s;
        if (s === r.status) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () { setStatus(r, sel.value); });
      lab.appendChild(sel);
      foot.appendChild(lab);
      card.appendChild(foot);
      list.appendChild(card);
    });
  }

  function setStatus(r, status) {
    var before = r.status;
    r.status = status;
    render();
    call(API + '/' + r.id, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: status }) })
      .catch(function (err) { r.status = before; render(); showError(err.message); });
  }

  function download(id) {
    call(API + '/' + id).then(function (j) {
      var rep = j.report;
      var url = URL.createObjectURL(new Blob([rep.attachment || ''], { type: 'text/plain' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = rep.attachment_name || ('report-' + id + '.nc');
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }, function (err) { showError(err.message); });
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    token = $('token').value.trim();
    try { localStorage.setItem('feedfix.inbox', token); } catch (err) { /* not remembered */ }
    load();
  });
  $('refresh').addEventListener('click', load);
  $('signOut').addEventListener('click', function () {
    token = '';
    try { localStorage.removeItem('feedfix.inbox'); } catch (err) { /* ignore */ }
    reports = [];
    $('inbox').hidden = true; $('refresh').hidden = true; $('signOut').hidden = true;
    $('login').hidden = false; $('token').value = '';
  });
  document.querySelector('.filters').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]');
    if (!b) return;
    filter = b.getAttribute('data-f');
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
    render();
  });
  if (token) load();
}());
</script>
</body>
</html>
